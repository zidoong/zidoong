
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루모스가이든 지둥 | 멘티 전용</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fa;
      font-family: Arial, "Apple SD Gothic Neo", sans-serif;
      color: #17191f;
    }

    header {
      padding: 26px 8%;
      background: #ffffff;
      border-bottom: 1px solid #e9eaee;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header span {
      color: #10a99c;
    }

    main {
      min-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #e8eaf0;
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 14px 50px #17191f0a;
    }

    .tag {
      color: #0c9c90;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 29px;
      letter-spacing: -1.2px;
      margin: 14px 0;
    }

    .desc {
      font-size: 14px;
      color: #7a7e88;
      margin-bottom: 34px;
      line-height: 1.8;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 18px 0 9px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #dedfe5;
      border-radius: 9px;
      font-size: 15px;
      background: #fbfbfc;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 9px;
      background: #17191f;
      color: white;
      font-size: 15px;
      font-weight: 700;
      margin-top: 25px;
      cursor: pointer;
    }

    button:hover {
      background: #0c9c90;
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 24px;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    LUMOS <span>GUIDE</span>
    <small style="font-size:12px;color:#999">
      × ZIDOONG
    </small>
  </header>

  <main>
    <section class="card">

      <div class="tag">PRIVATE MEMBERSHIP</div>

      <h1>멘티 전용 공간 ✦</h1>

      <p class="desc">
        루모스가이든 지둥 멘티를 위한<br>
        프라이빗 학습 및 콘텐츠 스튜디오
      </p>

      <form id="login">

        <label for="email">이메일</label>
        <input
          id="email"
          type="email"
          placeholder="이메일을 입력해 주세요"
          required
        >

        <label for="password">비밀번호</label>
        <input
          id="password"
          type="password"
          placeholder="비밀번호를 입력해 주세요"
          required
        >

        <button type="submit">로그인</button>

      </form>

      <p class="note">
        승인된 멘티만 이용할 수 있는 전용 공간입니다.
      </p>

    </section>
  </main>

  <footer>
    © 2026 LUMOS GUIDE × ZIDOONG
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://jcmwkpyxjyvafalpidqk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_2OkNTL-G6N2SOyf_IJG7SQ_VVEdokm1";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  document.getElementById("login").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const button = document.querySelector("#login button");

    button.disabled = true;
    button.textContent = "로그인 확인 중...";

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      const { data: profile, error: profileError } = await supabaseClient
        .from("mentee profiles")
        .select("approved")
        .eq("id", data.user.id)
        .single();
if (profileError) alert("승인 조회 오류: " + profileError.message);
      if (profileError || profile?.approved !== true) {
        await supabaseClient.auth.signOut();
        alert("아직 승인되지 않은 계정입니다. 멘토에게 문의해 주세요.");
        return;
      }

      alert("로그인 성공! 승인된 멘티입니다.");
    } catch (error) {
      alert("로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.");
    } finally {
      button.disabled = false;
      button.textContent = "로그인";
    }
  });
</script>



</body>
</html>
