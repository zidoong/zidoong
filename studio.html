<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>지둥 | 타로 홍보글 제작실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#191919;font-family:Arial,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:780px;margin:52px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4e7e8;border-radius:24px;padding:36px;box-shadow:0 14px 45px rgba(20,45,40,.04)}.top{display:flex;justify-content:space-between;gap:16px;align-items:start}.brand{font-size:18px;font-weight:800;letter-spacing:.02em}.sub{font-size:12px;color:#697573;margin-top:6px;letter-spacing:.16em}.pill{background:#e4f5e9;color:#147d48;border-radius:99px;padding:9px 12px;font-size:12px;white-space:nowrap}hr{border:0;border-top:1px solid #edf0ef;margin:26px 0}h1{font-size:28px;letter-spacing:-.05em;margin:0 0 12px}.lead{color:#737d7c;font-size:15px;line-height:1.7;margin:0 0 30px}.quota{background:#f3f9f7;padding:18px;border-radius:15px;margin-bottom:27px}.quota-head{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700}.quota-head span:last-child{color:#118a70}.bars{display:flex;gap:7px;margin-top:14px}.bar{flex:1;height:8px;background:#dce5e2;border-radius:10px}.bar.demo{background:#62bcb0}.note{font-size:12px;color:#88928f;margin-top:9px}.group{margin:23px 0}.label{display:block;color:#555e5c;font-size:14px;font-weight:700;margin-bottom:13px}.options{display:grid;gap:11px}.choice{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}.choice input{accent-color:#0b7469;width:17px;height:17px}textarea{width:100%;min-height:94px;border:1px solid #d8dedd;border-radius:12px;padding:14px;font:inherit;resize:vertical}textarea:focus{outline:2px solid #8ad0c6}.action{width:100%;border:0;border-radius:13px;background:#096d63;color:white;padding:17px;font-size:16px;font-weight:700;cursor:pointer}.action:disabled{opacity:.5;cursor:not-allowed}.result{margin-top:20px;background:#f6f9f8;border-radius:13px;padding:18px;white-space:pre-wrap;line-height:1.8}.hidden{display:none}.logout{border:0;background:transparent;color:#64706d;text-decoration:underline;cursor:pointer;font-size:13px;margin-top:16px}.status{text-align:center;color:#53615e;padding:45px 12px}@media(max-width:600px){.wrap{margin:18px auto}.card{padding:24px 20px}.brand{font-size:15px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
 <div id="checking" class="status">로그인 및 멘티 승인 상태를 확인하고 있어요...</div>
 <main id="studio" class="card hidden">
  <div class="top"><div><div class="brand">LUMOS GUIDE × ZIDOONG</div><div class="sub">PRIVATE AI STUDIO</div></div><span class="pill">승인된 멘티</span></div>
  <hr />
  <h1>타로 홍보글 제작실 ✦</h1>
  <p class="lead">주제와 분위기를 선택해 나만의 타로 홍보글을 준비해 보세요.</p>
  <div class="quota"><div class="quota-head"><span>오늘의 AI 글 생성 횟수</span><span id="remaining">연결 준비 중</span></div><div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="note">하루 3회 제한은 다음 단계에서 서버에 연결됩니다.</div></div>
  <form id="generator">
   <section class="group"><span class="label">홍보글 주제</span><div class="options">
    <label class="choice"><input type="radio" name="topic" value="재회 타로" checked>재회 타로</label>
    <label class="choice"><input type="radio" name="topic" value="연애 타로">연애 타로</label>
    <label class="choice"><input type="radio" name="topic" value="결혼 · 이혼 · 부부 상담">결혼 · 이혼 · 부부 상담</label>
    <label class="choice"><input type="radio" name="topic" value="직장 · 금전 · 진로">직장 · 금전 · 진로</label>
   </div></section>
   <section class="group"><span class="label">글의 분위기</span><div class="options">
    <label class="choice"><input type="radio" name="tone" value="현실적이고 직설적인" checked>현실적이고 직설적인</label>
    <label class="choice"><input type="radio" name="tone" value="공감과 위로 중심">공감과 위로 중심</label>
    <label class="choice"><input type="radio" name="tone" value="후킹이 강한">후킹이 강한</label>
   </div></section>
   <section class="group"><span class="label">글 형식</span><div class="options">
    <label class="choice"><input type="radio" name="format" value="스레드 짧은 글" checked>스레드 짧은 글</label>
    <label class="choice"><input type="radio" name="format" value="인스타그램 캡션">인스타그램 캡션</label>
   </div></section>
   <section class="group"><label class="label" for="details">추가 요청사항 (선택)</label><textarea id="details" placeholder="예: 연락이 끊긴 지 2주 된 커플 이야기"></textarea></section>
   <button id="generate" class="action" type="submit" disabled>✦ AI 홍보글 생성 (서버 연결 예정)</button>
  </form>
  <div id="result" class="result hidden"></div>
  <button id="logout" class="logout" type="button">로그아웃</button>
 </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jcmwkpyxjyvafalpidqk.supabase.co';
// index.html에 사용한 sb_publishable_... 공개키를 여기에 복사하세요. 비밀키는 절대 넣지 마세요.
const SUPABASE_PUBLISHABLE_KEY =  'sb_publishable_2OkNTL-G6N2SOyf_IJG7SQ_VVEdokm1';

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
async function checkAccess() {
 try {
  const {data:{user},error:authError} = await client.auth.getUser();
 alert("로그인 상태 확인: " + (authError ? authError.message : user ? "로그인 확인됨" : "로그인 정보 없음"));
  if(authError || !user) { window.location.replace('index.html'); return; }
  const {data:profile,error:profileError} = await client.from('mentee profiles').select('approved').eq('id',user.id).single();
alert("승인 확인: " + (profileError ? profileError.message : JSON.stringify(profile)));
  if(profileError || profile?.approved !== true) {
   await client.auth.signOut();
   alert('승인된 멘티만 이용할 수 있습니다.');
   window.location.replace('index.html');return;
  }
  document.getElementById('checking').classList.add('hidden');
  document.getElementById('studio').classList.remove('hidden');
 } catch(err) {
  document.getElementById('checking').textContent = '설정을 확인해 주세요: '+err.message;
 }
}
document.getElementById('generator').addEventListener('submit',e=>{e.preventDefault();alert('AI 생성 기능은 다음 단계에서 Supabase 서버와 연결합니다.');});
document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();window.location.replace('index.html');});
checkAccess();
</script>
</body>
</html>
